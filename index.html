<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠페인 게재보고 빌더</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #F5F4F0; --surface: #FFFFFF; --surface2: #EFEDE8;
  --border: #D8D4CC; --text: #1A1916; --text2: #6B6860;
  --meta: #E8501A; --tiktok: #010101;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 32px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--meta); }
.logo-text { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--text2); text-transform: uppercase; }
.btn-export {
  background: var(--text); color: #fff; border: none; border-radius: 8px;
  padding: 9px 20px; font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: inherit; display: flex; align-items: center; gap: 6px; transition: opacity .15s;
}
.btn-export:hover { opacity: .8; }
.btn-export svg { width: 14px; height: 14px; }

.container { max-width: 900px; margin: 0 auto; padding: 36px 24px 80px; }

/* COVER */
.cover-card {
  background: var(--text); border-radius: 16px; padding: 44px 48px;
  margin-bottom: 28px; color: #fff; position: relative; overflow: hidden;
}
.cover-card::before {
  content: ''; position: absolute; right: -50px; top: -50px;
  width: 240px; height: 240px; border-radius: 50%;
  border: 48px solid rgba(255,255,255,0.04);
}
.cover-label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 22px; }
.cover-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
.cover-static { font-size: 26px; font-weight: 300; color: rgba(255,255,255,0.25); white-space: nowrap; }
.cover-input {
  background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.18);
  color: #fff; font-family: inherit; font-size: 26px; font-weight: 300;
  padding: 2px 0 6px; outline: none; transition: border-color .15s;
}
.cover-input:focus { border-bottom-color: rgba(255,255,255,0.55); }
.cover-input::placeholder { color: rgba(255,255,255,0.2); }
.cover-input-sm { font-size: 15px; }
.cover-field-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }

/* SECTION HEADER */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); }
.btn-add {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 13px; font-size: 12px; font-weight: 500; cursor: pointer;
  font-family: inherit; color: var(--text); display: flex; align-items: center; gap: 5px; transition: background .1s;
}
.btn-add:hover { background: var(--surface2); }

/* PRODUCT BLOCK */
.product-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 18px; overflow: hidden; }
.product-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.product-num { width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--text2); flex-shrink: 0; }
.product-name-input { flex: 1; border: none; outline: none; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--text); background: transparent; }
.product-name-input::placeholder { color: var(--text2); font-weight: 400; }
.btn-remove { background: none; border: none; cursor: pointer; color: var(--text2); padding: 4px; border-radius: 4px; display: flex; align-items: center; transition: color .1s, background .1s; }
.btn-remove:hover { color: #c0392b; background: #fff0ee; }

/* CHANNEL TABS */
.channel-tabs { display: flex; border-bottom: 1px solid var(--border); }
.channel-tab { flex: 1; padding: 13px 16px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--text2); border-bottom: 2px solid transparent; transition: all .15s; user-select: none; }
.channel-tab:hover { background: var(--surface2); }
.channel-tab.active.meta { color: var(--meta); border-bottom-color: var(--meta); }
.channel-tab.active.tiktok { color: var(--tiktok); border-bottom-color: var(--tiktok); }
.channel-badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
.meta-badge { background: #FDEEE8; color: var(--meta); }
.tiktok-badge { background: #f0f0f0; color: #333; }

/* CHANNEL PANEL */
.channel-panel { padding: 22px; display: none; }
.channel-panel.active { display: block; }

/* IMAGE GRID — fixed 3 columns */
.image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
.slot-wrapper { display: flex; flex-direction: column; gap: 7px; }
.image-slot {
  border: 1.5px dashed var(--border); border-radius: 10px; aspect-ratio: 9/16;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden; transition: border-color .15s, background .15s;
  background: var(--surface2);
}
.image-slot:hover { border-color: #999; background: #E8E5DF; }
.image-slot.filled { border-style: solid; border-color: var(--border); background: #fff; }
.image-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; position: absolute; top: 0; left: 0; }
.image-slot-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; border-radius: 8px; }
.image-slot.filled:hover .image-slot-overlay { opacity: 1; }
.overlay-actions { display: flex; gap: 6px; }
.overlay-btn { background: white; border: none; border-radius: 6px; padding: 5px 11px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; }
.overlay-btn.del { background: #ff4444; color: #fff; }
.upload-icon { font-size: 24px; color: var(--text2); margin-bottom: 7px; }
.upload-hint { font-size: 11px; color: var(--text2); text-align: center; line-height: 1.5; }
.image-slot input[type=file] { display: none; }
.caption-input-below { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text); background: var(--surface); outline: none; transition: border-color .15s; }
.caption-input-below:focus { border-color: #999; }
.caption-input-below::placeholder { color: var(--text2); }

/* ADD IMAGE BTN */
.btn-add-image { width: 100%; border: 1.5px dashed var(--border); background: none; border-radius: 10px; padding: 12px; font-size: 12px; font-family: inherit; color: var(--text2); cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; }
.btn-add-image:hover { background: var(--surface2); border-color: #999; color: var(--text); }

/* SLOT COUNT HINT */
.slot-count-hint { font-size: 11px; color: var(--text2); margin-bottom: 10px; }

.footer-hint { text-align: center; font-size: 12px; color: var(--text2); margin-top: 44px; }

/* TOAST */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--text); color: #fff; padding: 9px 18px; border-radius: 99px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .25s; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* EXPORT PROGRESS */
.export-progress { position: fixed; inset: 0; background: rgba(26,25,22,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s; }
.export-progress.show { opacity: 1; pointer-events: all; }
.progress-box { background: white; border-radius: 14px; padding: 32px 40px; text-align: center; }
.progress-box p { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.progress-box small { font-size: 12px; color: var(--text2); }

@media (max-width: 640px) {
  .image-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .container { padding: 24px 14px 80px; }
  .cover-card { padding: 32px 24px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-dot"></div>
    <span class="logo-text">캠페인 게재보고 빌더</span>
  </div>
  <button class="btn-export" onclick="exportPDF()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    PDF 내보내기
  </button>
</div>

<div class="container">
  <!-- COVER -->
  <div class="cover-card">
    <div class="cover-label">대분류 — 보고서 정보</div>
    <div class="cover-field-label">월</div>
    <div class="cover-row">
      <input class="cover-input" id="coverMonth" placeholder="5" maxlength="3" style="max-width:80px" oninput="syncMonth()">
      <span class="cover-static">월 캠페인 게재보고</span>
    </div>
    <div class="cover-field-label" style="margin-top:6px">브랜드명</div>
    <input class="cover-input cover-input-sm" id="coverBrand" placeholder="구달" style="max-width:300px">
  </div>

  <!-- PRODUCTS -->
  <div class="section-header">
    <span class="section-title">중분류 — 상품 목록</span>
    <button class="btn-add" onclick="addProduct()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      상품 추가
    </button>
  </div>

  <div id="productList"></div>
  <p class="footer-hint">상품을 추가하고 Meta / TikTok 탭에서 이미지를 업로드하세요 · 한 채널당 최대 6개 이미지</p>
</div>

<div class="export-progress" id="exportProgress">
  <div class="progress-box">
    <p id="progressMsg">PDF 생성 중...</p>
    <small>잠시만 기다려 주세요</small>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ─── STATE ─── */
let products = [];
let productCounter = 0;
let slotCounter = 0;

function syncMonth() {
  const v = document.getElementById('coverMonth').value || '?';
  document.querySelectorAll('.month-sync').forEach(el => el.textContent = v);
}

/* ─── PRODUCT ─── */
function addProduct() {
  const id = ++productCounter;
  products.push({ id, name: '' });
  const list = document.getElementById('productList');
  const month = document.getElementById('coverMonth').value || '?';

  const div = document.createElement('div');
  div.className = 'product-block';
  div.id = `product-${id}`;
  div.innerHTML = `
    <div class="product-header">
      <div class="product-num" id="pnum-${id}">${products.length}</div>
      <input class="product-name-input" placeholder="${month}월 상품명 입력..."
             oninput="products.find(p=>p.id===${id}).name=this.value" />
      <button class="btn-remove" onclick="removeProduct(${id})" title="삭제">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="channel-tabs">
      <div class="channel-tab meta active" id="tab-meta-${id}" onclick="switchTab(${id},'meta')">
        <span>Meta</span><span class="channel-badge meta-badge">메타</span>
      </div>
      <div class="channel-tab tiktok" id="tab-tiktok-${id}" onclick="switchTab(${id},'tiktok')">
        <span>TikTok</span><span class="channel-badge tiktok-badge">틱톡</span>
      </div>
    </div>
    <div class="channel-panel active" id="panel-meta-${id}">
      <p class="slot-count-hint">소분류 · Meta — 이미지 최대 6개 (3열 × 2행)</p>
      <div class="image-grid" id="grid-meta-${id}"></div>
      <button class="btn-add-image" id="addbtn-meta-${id}" onclick="addSlot(${id},'meta')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        이미지 추가
      </button>
    </div>
    <div class="channel-panel" id="panel-tiktok-${id}">
      <p class="slot-count-hint">소분류 · TikTok — 이미지 최대 6개 (3열 × 2행)</p>
      <div class="image-grid" id="grid-tiktok-${id}"></div>
      <button class="btn-add-image" id="addbtn-tiktok-${id}" onclick="addSlot(${id},'tiktok')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        이미지 추가
      </button>
    </div>
  `;
  list.appendChild(div);
  addSlot(id, 'meta');
  addSlot(id, 'tiktok');
}

function removeProduct(id) {
  products = products.filter(p => p.id !== id);
  document.getElementById(`product-${id}`)?.remove();
  products.forEach((p, i) => {
    const el = document.getElementById(`pnum-${p.id}`);
    if (el) el.textContent = i + 1;
  });
}

function switchTab(pid, channel) {
  ['meta','tiktok'].forEach(ch => {
    document.getElementById(`tab-${ch}-${pid}`)?.classList.toggle('active', ch === channel);
    document.getElementById(`panel-${ch}-${pid}`)?.classList.toggle('active', ch === channel);
  });
}

/* ─── IMAGE SLOT ─── */
function addSlot(pid, channel) {
  const grid = document.getElementById(`grid-${channel}-${pid}`);
  const existing = grid.querySelectorAll('.slot-wrapper').length;
  if (existing >= 6) { showToast('최대 6개까지 추가할 수 있어요'); return; }

  const sid = `slot-${++slotCounter}`;
  const wrap = document.createElement('div');
  wrap.className = 'slot-wrapper';
  wrap.id = `wrap-${sid}`;

  const slot = document.createElement('div');
  slot.className = 'image-slot';
  slot.id = sid;
  slot.innerHTML = `
    <div class="upload-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <div class="upload-hint">클릭하여<br>업로드</div>
    <input type="file" accept="image/*" onchange="loadImage(this,'${sid}')">
    <div class="image-slot-overlay">
      <div class="overlay-actions">
        <button class="overlay-btn" onclick="event.stopPropagation();document.getElementById('${sid}').querySelector('input').click()">변경</button>
        <button class="overlay-btn del" onclick="event.stopPropagation();deleteSlot('${sid}','${pid}','${channel}')">삭제</button>
      </div>
    </div>
  `;
  slot.addEventListener('click', function() {
    if (!this.classList.contains('filled')) this.querySelector('input').click();
  });

  const cap = document.createElement('input');
  cap.className = 'caption-input-below';
  cap.id = `cap-${sid}`;
  cap.placeholder = '이미지 이름 / 계정명';

  wrap.appendChild(slot);
  wrap.appendChild(cap);
  grid.appendChild(wrap);

  // show/hide add button
  updateAddBtn(pid, channel);
}

function deleteSlot(sid, pid, channel) {
  document.getElementById(`wrap-${sid}`)?.remove();
  updateAddBtn(pid, channel);
}

function updateAddBtn(pid, channel) {
  const grid = document.getElementById(`grid-${channel}-${pid}`);
  const btn = document.getElementById(`addbtn-${channel}-${pid}`);
  if (!grid || !btn) return;
  const count = grid.querySelectorAll('.slot-wrapper').length;
  btn.style.display = count >= 6 ? 'none' : 'flex';
}

function loadImage(input, sid) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const slot = document.getElementById(sid);
    slot.classList.add('filled');
    slot.querySelector('.upload-icon').style.display = 'none';
    slot.querySelector('.upload-hint').style.display = 'none';
    let img = slot.querySelector('img');
    if (!img) { img = document.createElement('img'); slot.insertBefore(img, slot.querySelector('.image-slot-overlay')); }
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ─── PDF EXPORT (canvas-based → no font issues) ─── */
async function exportPDF() {
  const { jsPDF } = window.jspdf;
  const month = document.getElementById('coverMonth').value || '?';
  const brand = document.getElementById('coverBrand').value || '브랜드';

  showProgress('PDF 생성 시작...');

  // A4 Landscape: 297 × 210 mm → render at 2x = 1684 × 1190 px (72dpi * 2)
  const PX_W = 1684, PX_H = 1190;
  const MM_W = 297, MM_H = 210;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

  /* helper: canvas → add to PDF as full page image */
  const pageFromCanvas = (cvs, isFirst) => {
    const imgData = cvs.toDataURL('image/jpeg', 0.92);
    if (!isFirst) doc.addPage();
    doc.addImage(imgData, 'JPEG', 0, 0, MM_W, MM_H);
  };

  /* helper: make canvas */
  const mkCanvas = () => {
    const c = document.createElement('canvas');
    c.width = PX_W; c.height = PX_H;
    return c;
  };

  /* font loader — wait for Noto Sans KR */
  await document.fonts.load('400 16px "Noto Sans KR"');
  await document.fonts.load('500 16px "Noto Sans KR"');
  await document.fonts.load('700 16px "Noto Sans KR"');

  const S = PX_W / MM_W; // scale factor mm → px  ≈ 5.67
  const MARGIN = Math.round(16 * S);

  /* ── COVER PAGE ── */
  showProgress('커버 페이지 생성 중...');
  {
    const cvs = mkCanvas();
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#1A1916';
    ctx.fillRect(0, 0, PX_W, PX_H);

    // decorative circle
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 48 * S / 5;
    ctx.beginPath();
    ctx.arc(PX_W - 80*S/5, 80*S/5, 130*S/5, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = `400 ${Math.round(11*S/5)}px "Noto Sans KR"`;
    ctx.fillText('CAMPAIGN REPORT', MARGIN, Math.round(60*S/5));

    ctx.fillStyle = '#ffffff';
    ctx.font = `300 ${Math.round(42*S/5)}px "Noto Sans KR"`;
    ctx.fillText(`${month}월 캠페인 게재보고`, MARGIN, PX_H/2 - Math.round(20*S/5));

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `400 ${Math.round(20*S/5)}px "Noto Sans KR"`;
    ctx.fillText(brand, MARGIN, PX_H/2 + Math.round(24*S/5));

    pageFromCanvas(cvs, true);
  }

  /* ── PRODUCT PAGES ── */
  for (let pi = 0; pi < products.length; pi++) {
    const product = products[pi];
    const pName = product.name || '상품명';

    showProgress(`[${pi+1}/${products.length}] ${pName} 처리 중...`);

    /* DIVIDER */
    {
      const cvs = mkCanvas();
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#F5F4F0';
      ctx.fillRect(0,0,PX_W,PX_H);
      // left accent bar
      ctx.fillStyle = '#1A1916';
      ctx.fillRect(0, 0, Math.round(10*S/5), PX_H);

      const lx = Math.round(26*S/5);
      ctx.fillStyle = '#9A9790';
      ctx.font = `400 ${Math.round(11*S/5)}px "Noto Sans KR"`;
      ctx.fillText('PRODUCT', lx, PX_H/2 - Math.round(30*S/5));
      ctx.fillStyle = '#1A1916';
      ctx.font = `700 ${Math.round(34*S/5)}px "Noto Sans KR"`;
      ctx.fillText(pName, lx, PX_H/2 + Math.round(6*S/5));
      ctx.fillStyle = '#9A9790';
      ctx.font = `400 ${Math.round(14*S/5)}px "Noto Sans KR"`;
      ctx.fillText(`${month}월`, lx, PX_H/2 + Math.round(30*S/5));
      pageFromCanvas(cvs, false);
    }

    /* CHANNEL PAGES: meta + tiktok */
    for (const channel of ['meta', 'tiktok']) {
      const grid = document.getElementById(`grid-${channel}-${product.id}`);
      if (!grid) continue;
      const filledSlots = Array.from(grid.querySelectorAll('.slot-wrapper')).filter(w => w.querySelector('.image-slot.filled'));
      if (filledSlots.length === 0) continue;

      // group into pages of 6
      const IMGS_PER_PAGE = 6;
      const COLS = 3, ROWS = 2;

      for (let pageStart = 0; pageStart < filledSlots.length; pageStart += IMGS_PER_PAGE) {
        const pageSlots = filledSlots.slice(pageStart, pageStart + IMGS_PER_PAGE);
        const cvs = mkCanvas();
        const ctx = cvs.getContext('2d');

        // bg
        ctx.fillStyle = '#F5F4F0';
        ctx.fillRect(0, 0, PX_W, PX_H);

        // header bar
        const HEADER_H = Math.round(44 * S / 5);
        ctx.fillStyle = channel === 'meta' ? '#E8501A' : '#010101';
        ctx.fillRect(0, 0, PX_W, HEADER_H);

        // header text
        ctx.fillStyle = '#ffffff';
        ctx.font = `700 ${Math.round(13*S/5)}px "Noto Sans KR"`;
        const chLabel = channel === 'meta' ? 'Meta  메타' : 'TikTok  틱톡';
        ctx.fillText(`${pName}  —  ${chLabel}`, MARGIN, Math.round(27*S/5));
        ctx.font = `400 ${Math.round(10*S/5)}px "Noto Sans KR"`;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText(`${month}월 캠페인`, PX_W - MARGIN - Math.round(80*S/5), Math.round(27*S/5));

        // image grid: 3 cols × 2 rows fixed
        const PAD_TOP = HEADER_H + Math.round(14*S/5);
        const PAD_BOT = Math.round(18*S/5);
        const CAPTION_H = Math.round(22*S/5);
        const GAP = Math.round(12*S/5);
        const availW = PX_W - MARGIN*2;
        const availH = PX_H - PAD_TOP - PAD_BOT;
        const cellW = (availW - GAP*(COLS-1)) / COLS;
        const cellH = (availH - GAP*(ROWS-1)) / ROWS;
        const imgH = cellH - CAPTION_H - Math.round(4*S/5);

        for (let i = 0; i < pageSlots.length; i++) {
          const wrap = pageSlots[i];
          const imgEl = wrap.querySelector('img');
          const capEl = wrap.querySelector('.caption-input-below');
          const caption = capEl ? capEl.value : '';

          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const cx = MARGIN + col * (cellW + GAP);
          const cy = PAD_TOP + row * (cellH + GAP);

          // image placeholder bg
          ctx.fillStyle = '#E8E5DF';
          roundRect(ctx, cx, cy, cellW, imgH, Math.round(6*S/5));

          if (imgEl && imgEl.src && imgEl.src.startsWith('data:')) {
            try {
              await drawImageFit(ctx, imgEl.src, cx, cy, cellW, imgH);
            } catch(e) { /* skip */ }
          }

          // caption
          if (caption) {
            ctx.fillStyle = '#6B6860';
            ctx.font = `400 ${Math.round(10*S/5)}px "DM Mono", "Noto Sans KR", monospace`;
            const capY = cy + imgH + Math.round(14*S/5);
            ctx.fillText(caption, cx, capY, cellW);
          }
        }

        pageFromCanvas(cvs, false);
      }
    }
  }

  const filename = `${month}월_캠페인_게재보고_${brand}.pdf`;
  doc.save(filename);
  hideProgress();
  showToast(`✓  ${filename}  저장 완료`);
}

/* draw image object-fit:cover into rect */
function drawImageFit(ctx, src, x, y, w, h) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const scale = Math.max(w/iw, h/ih);
      const sw = iw*scale, sh = ih*scale;
      const sx = x + (w-sw)/2, sy = y + (h-sh)/2;
      ctx.save();
      ctx.beginPath();
      roundRectPath(ctx, x, y, w, h, 6);
      ctx.clip();
      ctx.drawImage(img, sx, sy, sw, sh);
      ctx.restore();
      res();
    };
    img.onerror = rej;
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  roundRectPath(ctx, x, y, w, h, r);
  ctx.fill();
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function showProgress(msg) {
  document.getElementById('progressMsg').textContent = msg;
  document.getElementById('exportProgress').classList.add('show');
}
function hideProgress() {
  document.getElementById('exportProgress').classList.remove('show');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

addProduct();
</script>
