<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠페인 게재보고 빌더</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --surface2: #EFEDE8;
    --border: #D8D4CC;
    --text: #1A1916;
    --text2: #6B6860;
    --accent: #1A1916;
    --meta: #E8501A;
    --tiktok: #010101;
    --tag-bg: #F0EDE6;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--meta); }
  .logo-text { font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: var(--text2); text-transform: uppercase; }
  .btn-export {
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-export:hover { opacity: 0.8; }
  .btn-export svg { width: 14px; height: 14px; }

  /* ─── LAYOUT ─── */
  .container { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

  /* ─── COVER SECTION ─── */
  .cover-card {
    background: var(--text);
    border-radius: 16px;
    padding: 48px;
    margin-bottom: 32px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .cover-card::before {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 40px solid rgba(255,255,255,0.04);
  }
  .cover-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
  }
  .cover-fields { display: flex; flex-direction: column; gap: 12px; }
  .cover-field { display: flex; flex-direction: column; gap: 6px; }
  .cover-field label { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; }
  .cover-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-family: inherit;
    font-size: 28px;
    font-weight: 300;
    padding: 4px 0 8px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }
  .cover-input:focus { border-bottom-color: rgba(255,255,255,0.5); }
  .cover-input::placeholder { color: rgba(255,255,255,0.2); }
  .cover-input-sm {
    font-size: 16px;
    font-weight: 400;
  }

  /* ─── ADD PRODUCT ─── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text2);
  }
  .btn-add {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.1s;
  }
  .btn-add:hover { background: var(--surface2); }

  /* ─── PRODUCT BLOCK ─── */
  .product-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .product-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .product-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    flex-shrink: 0;
  }
  .product-name-input {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
  }
  .product-name-input::placeholder { color: var(--text2); font-weight: 400; }
  .btn-remove {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text2);
    padding: 4px;
    border-radius: 4px;
    transition: color 0.1s, background 0.1s;
    display: flex; align-items: center;
  }
  .btn-remove:hover { color: #c0392b; background: #fff0ee; }

  /* ─── CHANNEL TABS ─── */
  .channel-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
  }
  .channel-tab {
    flex: 1;
    padding: 14px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }
  .channel-tab:hover { background: var(--surface2); }
  .channel-tab.active.meta { color: var(--meta); border-bottom-color: var(--meta); }
  .channel-tab.active.tiktok { color: var(--tiktok); border-bottom-color: var(--tiktok); }
  .channel-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 99px;
    font-weight: 500;
  }
  .meta-badge { background: #FDEEE8; color: var(--meta); }
  .tiktok-badge { background: #f0f0f0; color: #333; }

  /* ─── CHANNEL PANEL ─── */
  .channel-panel { padding: 24px; display: none; }
  .channel-panel.active { display: block; }

  /* ─── IMAGE GRID ─── */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }
  .image-slot {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    aspect-ratio: 3/4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s, background 0.15s;
    background: var(--surface2);
  }
  .image-slot:hover { border-color: #999; background: #E8E5DF; }
  .image-slot.filled { border-style: solid; border-color: var(--border); background: #fff; }
  .image-slot img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 8px;
    position: absolute;
    top: 0; left: 0;
  }
  .image-slot-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    border-radius: 8px;
  }
  .image-slot.filled:hover .image-slot-overlay { opacity: 1; }
  .overlay-btn {
    background: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .upload-icon { font-size: 24px; color: var(--text2); margin-bottom: 8px; }
  .upload-hint { font-size: 12px; color: var(--text2); text-align: center; }
  .image-slot input[type=file] { display: none; }
  .image-caption-input {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.6);
    border: none;
    padding: 8px 10px;
    font-size: 11px;
    color: #fff;
    font-family: 'DM Mono', monospace;
    outline: none;
    backdrop-filter: blur(4px);
  }
  .image-caption-input::placeholder { color: rgba(255,255,255,0.5); }
  .caption-below {
    margin-top: 8px;
    width: 100%;
  }
  .caption-input-below {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s;
  }
  .caption-input-below:focus { border-color: #999; }

  /* ─── ADD IMAGE BUTTON ─── */
  .btn-add-image {
    width: 100%;
    border: 1.5px dashed var(--border);
    background: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 500;
  }
  .btn-add-image:hover { background: var(--surface2); border-color: #999; color: var(--text); }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text2);
  }
  .empty-state p { font-size: 14px; }

  /* ─── FOOTER ─── */
  .footer-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text2);
    margin-top: 48px;
  }

  /* ─── PRINT / EXPORT PREVIEW (hidden) ─── */
  #exportCanvas { display: none; }

  /* ─── STATUS TOAST ─── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .container { padding: 24px 16px 80px; }
    .cover-card { padding: 32px 24px; }
    .cover-input { font-size: 22px; }
    .image-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-dot"></div>
    <span class="logo-text">캠페인 게재보고 빌더</span>
  </div>
  <button class="btn-export" onclick="exportPDF()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    PDF 내보내기
  </button>
</div>

<div class="container">

  <!-- COVER -->
  <div class="cover-card" id="coverCard">
    <div class="cover-label">대분류</div>
    <div class="cover-fields">
      <div class="cover-field">
        <label>월</label>
        <input class="cover-input" id="coverMonth" placeholder="5" maxlength="3" style="max-width:120px">
      </div>
      <div class="cover-field">
        <label>보고서 제목</label>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="color:rgba(255,255,255,0.4);font-size:22px;font-weight:300" id="coverMonthDisplay">5</span>
          <span style="color:rgba(255,255,255,0.25);font-size:22px;font-weight:300">월 캠페인 게재보고</span>
        </div>
      </div>
      <div class="cover-field">
        <label>브랜드</label>
        <input class="cover-input cover-input-sm" id="coverBrand" placeholder="구달">
      </div>
    </div>
  </div>

  <!-- PRODUCTS -->
  <div class="section-header">
    <span class="section-title">중분류 — 상품</span>
    <button class="btn-add" onclick="addProduct()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      상품 추가
    </button>
  </div>

  <div id="productList"></div>

  <div class="footer-hint">상품을 추가하고 메타 / 틱톡 탭에서 이미지를 업로드하세요</div>
</div>

<div class="toast" id="toast"></div>
<canvas id="exportCanvas"></canvas>

<script>
let products = [];
let productCounter = 0;

// sync month display
document.getElementById('coverMonth').addEventListener('input', function() {
  document.getElementById('coverMonthDisplay').textContent = this.value || '5';
});

function addProduct() {
  const id = ++productCounter;
  const product = { id, name: '', meta: [], tiktok: [] };
  products.push(product);
  renderProduct(product);
}

function removeProduct(id) {
  products = products.filter(p => p.id !== id);
  const el = document.getElementById(`product-${id}`);
  if (el) el.remove();
  renumberProducts();
}

function renumberProducts() {
  products.forEach((p, i) => {
    const numEl = document.querySelector(`#product-${p.id} .product-num`);
    if (numEl) numEl.textContent = i + 1;
  });
}

function renderProduct(product) {
  const list = document.getElementById('productList');
  const month = document.getElementById('coverMonth').value || '5';

  const div = document.createElement('div');
  div.className = 'product-block';
  div.id = `product-${product.id}`;
  div.innerHTML = `
    <div class="product-header">
      <div class="product-num">${products.length}</div>
      <input class="product-name-input" placeholder="${month}월 상품명 입력..." 
             oninput="updateProductName(${product.id}, this.value)"
             value="${product.name}">
      <button class="btn-remove" onclick="removeProduct(${product.id})" title="삭제">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="channel-tabs">
      <div class="channel-tab meta active" onclick="switchTab(${product.id}, 'meta', this)">
        <span>Meta</span>
        <span class="channel-badge meta-badge">메타</span>
      </div>
      <div class="channel-tab tiktok" onclick="switchTab(${product.id}, 'tiktok', this)">
        <span>TikTok</span>
        <span class="channel-badge tiktok-badge">틱톡</span>
      </div>
    </div>
    <div class="channel-panel active" id="panel-meta-${product.id}" data-channel="meta" data-pid="${product.id}">
      <div class="image-grid" id="grid-meta-${product.id}"></div>
      <button class="btn-add-image" onclick="addImageSlot(${product.id}, 'meta')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        이미지 추가
      </button>
    </div>
    <div class="channel-panel" id="panel-tiktok-${product.id}" data-channel="tiktok" data-pid="${product.id}">
      <div class="image-grid" id="grid-tiktok-${product.id}"></div>
      <button class="btn-add-image" onclick="addImageSlot(${product.id}, 'tiktok')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        이미지 추가
      </button>
    </div>
  `;
  list.appendChild(div);

  // Add default empty slot
  addImageSlot(product.id, 'meta');
  addImageSlot(product.id, 'tiktok');
}

function updateProductName(id, val) {
  const p = products.find(p => p.id === id);
  if (p) p.name = val;
}

function switchTab(pid, channel, tabEl) {
  const block = document.getElementById(`product-${pid}`);
  block.querySelectorAll('.channel-tab').forEach(t => t.classList.remove('active'));
  block.querySelectorAll('.channel-panel').forEach(p => p.classList.remove('active'));
  tabEl.classList.add('active');
  document.getElementById(`panel-${channel}-${pid}`).classList.add('active');
}

let slotCounter = 0;

function addImageSlot(pid, channel) {
  const grid = document.getElementById(`grid-${channel}-${pid}`);
  const slotId = `slot-${++slotCounter}`;

  const wrapper = document.createElement('div');
  wrapper.className = 'slot-wrapper';
  wrapper.id = `wrapper-${slotId}`;

  const slot = document.createElement('div');
  slot.className = 'image-slot';
  slot.id = slotId;
  slot.innerHTML = `
    <div class="upload-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <div class="upload-hint">클릭하여<br>이미지 업로드</div>
    <input type="file" accept="image/*" onchange="handleImageUpload(this, '${slotId}')">
    <div class="image-slot-overlay">
      <button class="overlay-btn" onclick="event.stopPropagation(); changeImage('${slotId}')">변경</button>
    </div>
  `;
  slot.addEventListener('click', function(e) {
    if (!this.classList.contains('filled')) {
      this.querySelector('input[type=file]').click();
    }
  });

  const captionWrap = document.createElement('div');
  captionWrap.className = 'caption-below';
  captionWrap.innerHTML = `<input class="caption-input-below" placeholder="이미지 이름 / 계정명" id="caption-${slotId}">`;

  wrapper.appendChild(slot);
  wrapper.appendChild(captionWrap);
  grid.appendChild(wrapper);
}

function handleImageUpload(input, slotId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const slot = document.getElementById(slotId);
    slot.classList.add('filled');

    // Remove upload UI
    slot.querySelector('.upload-icon').style.display = 'none';
    slot.querySelector('.upload-hint').style.display = 'none';

    // Add image
    let img = slot.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      slot.insertBefore(img, slot.querySelector('.image-slot-overlay'));
    }
    img.src = e.target.result;
    img.dataset.filename = file.name;
  };
  reader.readAsDataURL(file);
}

function changeImage(slotId) {
  document.getElementById(slotId).querySelector('input[type=file]').click();
}

// ─── PDF EXPORT ───────────────────────────────────────────
async function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = 297, H = 210;
  const margin = 16;

  const month = document.getElementById('coverMonth').value || '5';
  const brand = document.getElementById('coverBrand').value || '브랜드';

  // Helper
  const hex2rgb = hex => {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return [r,g,b];
  };

  // ─ COVER SLIDE ─
  doc.setFillColor(26,25,22);
  doc.rect(0,0,W,H,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text('CAMPAIGN REPORT', margin, 30);
  doc.setFontSize(36);
  doc.setFont('helvetica','light');
  doc.text(`${month}월 캠페인 게재보고`, margin, H/2 - 8);
  doc.setFontSize(18);
  doc.setTextColor(160,158,155);
  doc.text(brand, margin, H/2 + 16);

  for (const product of products) {
    const pName = product.name || '상품명';

    // ─ PRODUCT DIVIDER SLIDE ─
    doc.addPage();
    doc.setFillColor(245,244,240);
    doc.rect(0,0,W,H,'F');
    doc.setFillColor(26,25,22);
    doc.rect(0,0,8,H,'F');
    doc.setTextColor(26,25,22);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.text('PRODUCT', 20, H/2 - 14);
    doc.setFontSize(28);
    doc.setFont('helvetica','bold');
    doc.text(pName, 20, H/2 + 4);
    doc.setFontSize(11);
    doc.setFont('helvetica','normal');
    doc.setTextColor(107,104,96);
    doc.text(`${month}월`, 20, H/2 + 18);

    // ─ META SLIDE ─
    await addChannelSlide(doc, product.id, 'meta', pName, month, W, H, margin);
    // ─ TIKTOK SLIDE ─
    await addChannelSlide(doc, product.id, 'tiktok', pName, month, W, H, margin);
  }

  const filename = `${month}월_캠페인_게재보고_${brand}.pdf`;
  doc.save(filename);
  showToast(`✓ ${filename} 저장완료`);
}

async function addChannelSlide(doc, pid, channel, productName, month, W, H, margin) {
  const grid = document.getElementById(`grid-${channel}-${pid}`);
  if (!grid) return;
  const slots = grid.querySelectorAll('.image-slot.filled');
  if (slots.length === 0) return;

  doc.addPage();

  // Background
  doc.setFillColor(245,244,240);
  doc.rect(0,0,W,H,'F');

  // Header bar
  const isMeta = channel === 'meta';
  const barColor = isMeta ? [232,80,26] : [1,1,1];
  doc.setFillColor(...barColor);
  doc.rect(0,0,W,36,'F');

  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  const chLabel = iseta ? 'Meta' : 'TikTok';
  const chLabel2 = iseta ? '메타' : '틱톡';
  doc.text(`${productName}  —  ${chLabel} ${chLabel2}`, margin, 23);

  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(255,255,255,0.6);
  doc.text(`${month}월 캠페인`, W - margin - 40, 23);

  // Images
  const imgs = Array.from(slots);
  const count = imgs.length;
  const cols = Math.min(count, 4);
  const rows = Math.ceil(count / cols);
  const padTop = 44;
  const padBot = 12;
  const avW = W - margin*2;
  const avH = H - padTop - padBot;
  const cellW = avW / cols;
  const cellH = avH / rows;
  const imgPad = 5;

  for (let i = 0; i < count; i++) {
    const slot = imgs[i];
    const img = slot.querySelector('img');
    if (!img || !img.src) continue;
    const captionEl = document.getElementById(`caption-${slot.id}`);
    const caption = captionEl ? captionEl.value : '';

    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = margin + col * cellW + imgPad;
    const y = padTop + row * cellH + imgPad;
    const iW = cellW - imgPad*2;
    const iH = cellH - imgPad*2 - (caption ? 14 : 0);

    try {
      const fmt = img.src.includes('png') ? 'PNG' : 'JPEG';
      doc.addImage(img.src, fmt, x, y, iW, iH);
    } catch(e) {
      // skip unloadable images
    }

    if (caption) {
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(107,104,96);
      doc.text(caption, x, y + iH + 9);
    }
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
